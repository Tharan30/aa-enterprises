name: Repository security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m py_compile ledger_web.py Petrolbunk.py ledger_security.py
      - run: python tests/check_security.py
      - run: python tests/check_auth.py
      - run: python tests/check_workspace.py
      - run: python -m pip_audit -r requirements.lock
